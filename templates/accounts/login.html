{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="text-center mb-4 fade-in-up">
        <div style="font-size:3rem;margin-bottom:0.75rem;">⚡</div>
        <h1 class="h3">Welcome Back</h1>
        <p style="color:var(--text-secondary);">Sign in to your HireFlow account</p>
      </div>
      <div class="glass-card-static p-4 p-md-5 fade-in-up-delay-1">
        {% crispy form %}
        <p class="text-center mt-3" style="color:var(--text-muted);">
          Don't have an account?
          <a href="{% url 'accounts:register' %}" style="color:var(--primary-light);">Create one →</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
