{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="d-flex align-items-center gap-3 mb-4">
        <a href="{% url 'accounts:profile' %}" class="btn btn-secondary-glass btn-sm">
          <i class="bi bi-arrow-left me-1"></i>Back
        </a>
        <h1 class="h3 mb-0">Edit Profile</h1>
      </div>

      <div class="glass-card-static p-4 mb-4">
        <h5 class="mb-3" style="color:var(--text-secondary);">Personal Information</h5>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {% crispy user_form %}
          <hr class="divider">
          <h5 class="mb-3" style="color:var(--text-secondary);">Profile Details</h5>
          {% crispy profile_form %}
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
